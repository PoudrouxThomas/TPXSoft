openapi: 3.0.3
info:
  title: TPXSoft Documents API
  version: "1.0"
  description: >
    Document storage, virtual folders, ownership, and sharing. This contract
    is written ahead of the module implementation (contract-first) -- see
    modules/documents/CLAUDE.md, once scaffolded, for the concrete entity
    model and known assumptions (content stored as Postgres bytea, no
    document version history, no anonymous access except the public-link
    download route below).

paths:
  /documents:
    post:
      operationId: uploadDocument
      summary: Upload a new document, owned by the caller.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                folderId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "201":
          description: Document created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Validation failed (e.g. empty file, missing filename).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      operationId: listDocuments
      summary: List documents visible to the caller, optionally scoped to a folder.
      security:
        - bearerAuth: []
      parameters:
        - name: folderId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: mine
          in: query
          required: false
          description: When true, restrict to documents owned by the caller.
          schema:
            type: boolean
      responses:
        "200":
          description: Matching documents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /documents/{id}:
    get:
      operationId: getDocument
      summary: Fetch a document's metadata.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller cannot see this document (not owner, not shared, not org-visible).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No document with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      operationId: updateDocument
      summary: Rename and/or move a document. Content and visibility are updated via their own endpoints.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentRequest"
      responses:
        "200":
          description: Updated document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No document with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: deleteDocument
      summary: Delete a document.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Document deleted.
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No document with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /documents/{id}/content:
    get:
      operationId: downloadDocumentContent
      summary: Download a document's raw bytes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Raw file bytes, Content-Type set to the document's stored contentType.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller cannot see this document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No document with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      operationId: replaceDocumentContent
      summary: Replace a document's file bytes, keeping the same id and sharing state.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Document with updated content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Validation failed (e.g. empty file).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No document with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /documents/{id}/visibility:
    put:
      operationId: setDocumentVisibility
      summary: >
        Change who can find a document. Setting PublicLink (re)generates
        publicLinkToken; setting Private or Organization clears it. This is
        separate from per-user share grants, which persist regardless of
        visibility.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetVisibilityRequest"
      responses:
        "200":
          description: Document with updated visibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Validation failed (e.g. unknown visibility value).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No document with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /documents/{id}/shares:
    get:
      operationId: listDocumentShares
      summary: List explicit per-user share grants for a document.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Share grants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentShare"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No document with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      operationId: shareDocumentWithUser
      summary: Grant a specific user access to a document, regardless of its visibility.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareDocumentRequest"
      responses:
        "201":
          description: Share grant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentShare"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No document with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This user already has a share grant for this document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /documents/{id}/shares/{userId}:
    delete:
      operationId: revokeDocumentShare
      summary: Revoke a specific user's share grant for a document.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Share grant revoked (idempotent -- also 204 if it never existed).
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No document with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /public/documents/{token}/content:
    get:
      operationId: downloadPublicDocumentContent
      summary: >
        Download a document by its public-link token. Unauthenticated --
        the only route in this contract that does not require a bearer
        token. Never appears in any user's file list or "shared with";
        reachable only by someone holding the exact link.
      responses:
        "200":
          description: Raw file bytes, Content-Type set to the document's stored contentType.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No document with this token, or its visibility is no longer PublicLink.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /folders:
    post:
      operationId: createFolder
      summary: Create a virtual folder, owned by the caller.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "201":
          description: Folder created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "400":
          description: Validation failed (e.g. empty name).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: parentFolderId does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      operationId: listFolders
      summary: List the caller's folders, optionally scoped to a parent.
      security:
        - bearerAuth: []
      parameters:
        - name: parentFolderId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Matching folders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Folder"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /folders/{id}:
    get:
      operationId: getFolder
      summary: Fetch a folder's metadata.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FolderId"
      responses:
        "200":
          description: Folder metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No folder with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      operationId: updateFolder
      summary: Rename and/or move a folder.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FolderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFolderRequest"
      responses:
        "200":
          description: Updated folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "400":
          description: Validation failed (e.g. moving a folder into its own descendant).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No folder with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: deleteFolder
      summary: Delete an empty folder.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FolderId"
      responses:
        "204":
          description: Folder deleted.
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No folder with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Folder is not empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /folders/{id}/children:
    get:
      operationId: listFolderChildren
      summary: List the subfolders and documents directly inside a folder.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FolderId"
      responses:
        "200":
          description: Direct children.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderChildren"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No folder with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Same access token issued by TPXSoft.Auth -- see contracts/auth.v1.yaml's
        bearerAuth description for claim shape. sub (User.Id) and orgId drive
        ownership and Organization-visibility checks in this module.

  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    FolderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Visibility:
      type: string
      enum: [Private, Organization, PublicLink]
      description: >
        Private: owner plus explicit share grants only. Organization: any
        authenticated user in the owner's org, discoverable. PublicLink:
        reachable only via publicLinkToken through the unauthenticated
        /public/documents/{token}/content route -- never listed for other
        users. Independent of explicit per-user share grants, which apply
        under any visibility.

    Document:
      type: object
      required: [id, ownerUserId, folderId, fileName, contentType, sizeBytes, visibility, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        folderId:
          type: string
          format: uuid
          nullable: true
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        visibility:
          $ref: "#/components/schemas/Visibility"
        publicLinkToken:
          type: string
          nullable: true
          description: Present only when visibility is PublicLink.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateDocumentRequest:
      type: object
      properties:
        fileName:
          type: string
        folderId:
          type: string
          format: uuid
          nullable: true

    SetVisibilityRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: "#/components/schemas/Visibility"

    DocumentShare:
      type: object
      required: [id, documentId, grantedToUserId, grantedByUserId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        grantedToUserId:
          type: string
          format: uuid
        grantedByUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    ShareDocumentRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    Folder:
      type: object
      required: [id, ownerUserId, parentFolderId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        parentFolderId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        parentFolderId:
          type: string
          format: uuid
          nullable: true

    UpdateFolderRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        parentFolderId:
          type: string
          format: uuid
          nullable: true

    FolderChildren:
      type: object
      required: [folders, documents]
      properties:
        folders:
          type: array
          items:
            $ref: "#/components/schemas/Folder"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
