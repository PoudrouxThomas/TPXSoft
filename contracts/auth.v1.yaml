openapi: 3.0.3
info:
  title: TPXSoft Auth API
  version: "1.0"
  description: >
    OIDC-ish JWT issuance, users, orgs, roles. Minimal Phase 1 scope: an Org
    is created at registration, each User belongs to exactly one Org, and
    Role is a plain field on User rather than a separate entity.

paths:
  /auth/register:
    post:
      operationId: register
      summary: Register a new Org and its first User (as Admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Org and Admin user created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Validation failed (e.g. password too short, malformed email).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      operationId: login
      summary: Exchange email + password for a token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Validation failed (e.g. malformed request body).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate a refresh token for a new token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair issued; the old refresh token is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Validation failed (e.g. malformed request body).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Refresh token invalid, expired, or already revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Refresh token revoked (idempotent -- also 204 if already revoked).

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: The user identified by the bearer access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token claims (not otherwise expressible in OpenAPI, but part
        of this contract -- treat a change to these as breaking): sub (User.Id),
        email, orgId, role ("Admin" | "Member"), plus standard jti/iat/exp/iss/aud.

  schemas:
    Role:
      type: string
      enum: [Admin, Member]

    RegisterRequest:
      type: object
      required: [email, password, orgName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        orgName:
          type: string
          minLength: 1

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    User:
      type: object
      required: [id, email, orgId, orgName, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        orgId:
          type: string
          format: uuid
        orgName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
