services:
  postgres:
    image: postgres:16
    container_name: ${COMPOSE_PROJECT_NAME:-tpxsoft}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tpxsoft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tpxsoft}
      POSTGRES_DB: ${POSTGRES_DB:-tpxsoft}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tpxsoft}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-api:
    build:
      context: .
      dockerfile: modules/auth/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-tpxsoft}-auth-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__AuthDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-tpxsoft};Username=${POSTGRES_USER:-tpxsoft};Password=${POSTGRES_PASSWORD:-tpxsoft}
      Auth__Jwt__SigningKey: ${AUTH_JWT_SIGNING_KEY:-dev-only-jwt-signing-key-do-not-use-in-production-01234567}
      Auth__Cors__AllowedOrigins__0: http://localhost:4200
      Auth__ApplyMigrationsAtStartup: "true"
    ports:
      - "${AUTH_PORT:-5081}:8080"

  documents-api:
    build:
      context: .
      dockerfile: modules/documents/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-tpxsoft}-documents-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DocumentsDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-tpxsoft};Username=${POSTGRES_USER:-tpxsoft};Password=${POSTGRES_PASSWORD:-tpxsoft}
      Documents__Jwt__SigningKey: ${AUTH_JWT_SIGNING_KEY:-dev-only-jwt-signing-key-do-not-use-in-production-01234567}
      Documents__ApplyMigrationsAtStartup: "true"
    ports:
      - "${DOCUMENTS_PORT:-5082}:8080"

volumes:
  postgres-data:
