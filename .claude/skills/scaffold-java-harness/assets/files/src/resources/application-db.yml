spring:
  application:
    name: __ARTIFACT__
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:__DB_PORT__/__DB_NAME__}
    username: ${DB_USER:__DB_NAME__}
    password: ${DB_PASSWORD:__DB_NAME__}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: __PORT__
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# No default credential on purpose: unset means a random one-run password, never a
# known one that quietly survives into an environment that matters.
app:
  security:
    api-user: ${API_USER:api}
    api-password: ${API_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
