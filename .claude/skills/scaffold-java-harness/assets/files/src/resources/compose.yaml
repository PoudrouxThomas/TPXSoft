# Local database only. Spring Boot picks this up automatically when the
# spring-boot-docker-compose dependency is present; otherwise: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: __DB_NAME__
      POSTGRES_USER: __DB_NAME__
      POSTGRES_PASSWORD: __DB_NAME__
    ports:
      - "__DB_PORT__:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U __DB_NAME__"]
      interval: 5s
      timeout: 3s
      retries: 10
